name: Android CI / Build Medical Guide

# تحديد متى يتم تشغيل الـ Workflow (عند عمل Push أو Pull Request لفرع main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK and Run Tests
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا JDK المطلوبة لتطوير أندرويد
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # 3. إعطاء صلاحيات التشغيل لملف Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. بناء تطبيق أندرويد وتوليد ملف الـ Debug APK
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 5. حفظ وحزم ملف الـ APK الناتج ليكون جاهزاً للتحميل من GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
